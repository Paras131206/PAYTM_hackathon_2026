<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1020" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#002970" flood-opacity="0.06"/>
    </filter>
    <filter id="glow-orange" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#d97706" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Border Frame matching Canva style -->
  <rect x="12" y="12" width="876" height="996" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="12" cy="510" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="888" cy="510" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="450" cy="12" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="450" cy="1008" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>

  <!-- Header -->
  <text x="36" y="52" fill="#0d6e6e" font-size="22" font-weight="800" letter-spacing="0.5">END-TO-END WORKFLOW</text>
  <text x="844" y="52" fill="#0f172a" font-size="18" font-weight="800" text-anchor="end" letter-spacing="0.5">FIGURE NO: 01</text>

  <!-- Flow Connector Lines (Vertical Central Spine) -->
  <line x1="390" y1="125" x2="390" y2="148" stroke="#94a3b8" stroke-width="2"/>
  <line x1="390" y1="208" x2="390" y2="231" stroke="#94a3b8" stroke-width="2"/>
  <line x1="390" y1="291" x2="390" y2="314" stroke="#94a3b8" stroke-width="2"/>
  <line x1="390" y1="374" x2="390" y2="397" stroke="#94a3b8" stroke-width="2"/>
  <line x1="390" y1="457" x2="390" y2="480" stroke="#94a3b8" stroke-width="2"/>
  <line x1="390" y1="540" x2="390" y2="570" stroke="#94a3b8" stroke-width="2"/>

  <!-- Decision Branch Lines -->
  <!-- YES (to right) -->
  <path d="M 505 510 L 630 510" fill="none" stroke="#d97706" stroke-width="2"/>
  <line x1="740" y1="550" x2="740" y2="580" stroke="#d97706" stroke-width="2"/>
  <path d="M 630 620 L 590 620 L 590 675" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- NO (straight down) -->
  <line x1="390" y1="540" x2="390" y2="640" stroke="#0d6e6e" stroke-width="2"/>
  <line x1="390" y1="710" x2="390" y2="735" stroke="#94a3b8" stroke-width="2"/>

  <!-- ==================== STEP 1 ==================== -->
  <g transform="translate(36, 75)">
    <!-- Actor Box -->
    <rect x="0" y="0" width="140" height="60" rx="8" fill="#1e293b"/>
    <text x="70" y="36" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">PAYTM / OPS</text>
    <!-- Step Box -->
    <rect x="150" y="0" width="425" height="60" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="165" y="27" fill="#0d6e6e" font-size="15" font-weight="800">1</text>
    <text x="185" y="27" fill="#1e293b" font-size="13" font-weight="600">Configure deterministic rules &amp; safety limits</text>
    <text x="185" y="46" fill="#475569" font-size="12">(Auto-refund ≤ ₹2,000, T+1 TAT, KYC tiers, tool permissions)</text>
  </g>

  <!-- ==================== STEP 2 ==================== -->
  <g transform="translate(36, 158)">
    <!-- Actor Box -->
    <rect x="0" y="0" width="140" height="60" rx="8" fill="#0d6e6e"/>
    <text x="70" y="36" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">CUSTOMER</text>
    <!-- Step Box -->
    <rect x="150" y="0" width="425" height="60" rx="8" fill="#ffffff" stroke="#0d6e6e" stroke-width="2" filter="url(#shadow)"/>
    <text x="165" y="27" fill="#0d6e6e" font-size="15" font-weight="800">2</text>
    <text x="185" y="27" fill="#1e293b" font-size="13" font-weight="600">Report payment issue via in-app support chat</text>
    <text x="185" y="46" fill="#475569" font-size="12">("Money debited but failed", duplicate charge, pending stuck)</text>
  </g>

  <!-- ==================== STEP 3 ==================== -->
  <g transform="translate(36, 241)">
    <!-- Actor Box -->
    <rect x="0" y="0" width="140" height="60" rx="8" fill="#0d6e6e"/>
    <text x="70" y="36" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">INGESTION</text>
    <!-- Step Box -->
    <rect x="150" y="0" width="425" height="60" rx="8" fill="#ffffff" stroke="#0d6e6e" stroke-width="2" filter="url(#shadow)"/>
    <text x="165" y="27" fill="#0d6e6e" font-size="15" font-weight="800">3</text>
    <text x="185" y="27" fill="#1e293b" font-size="13" font-weight="600">Ingest context, masked PII &amp; run security guards</text>
    <text x="185" y="46" fill="#475569" font-size="12">Deterministic checks for prompt injection, fraud, human intent</text>
  </g>

  <!-- ==================== STEP 4 ==================== -->
  <g transform="translate(36, 324)">
    <!-- Actor Box -->
    <rect x="0" y="0" width="140" height="60" rx="8" fill="#334155"/>
    <text x="70" y="36" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">CORE ENGINE</text>
    <!-- Step Box -->
    <rect x="150" y="0" width="425" height="60" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="165" y="27" fill="#0d6e6e" font-size="15" font-weight="800">4</text>
    <text x="185" y="27" fill="#1e293b" font-size="13" font-weight="600">Verify ground truth via Bank / Switch adapter</text>
    <text x="185" y="46" fill="#475569" font-size="12">Tool call check_switch_status: reconcile App vs Bank debit</text>
  </g>

  <!-- ==================== STEP 5 ==================== -->
  <g transform="translate(36, 407)">
    <!-- Actor Box -->
    <rect x="0" y="0" width="140" height="60" rx="8" fill="#334155"/>
    <text x="70" y="36" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">POLICY CHECK</text>
    <!-- Step Box -->
    <rect x="150" y="0" width="425" height="60" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="165" y="27" fill="#0d6e6e" font-size="15" font-weight="800">5</text>
    <text x="185" y="27" fill="#1e293b" font-size="13" font-weight="600">Evaluate pure deterministic refund policy</text>
    <text x="185" y="46" fill="#475569" font-size="12">Verify T+1 TAT, duplicate debits, and threshold limit tests</text>
  </g>

  <!-- ==================== DECISION DIAMOND ==================== -->
  <g transform="translate(275, 480)">
    <polygon points="115,0 230,30 115,60 0,30" fill="#fffbeb" stroke="#d97706" stroke-width="2.2" filter="url(#glow-orange)"/>
    <text x="115" y="35" fill="#92400e" font-size="14" font-weight="800" text-anchor="middle">Exception or Flag raised?</text>
    <!-- Labels -->
    <text x="245" y="22" fill="#d97706" font-size="13" font-weight="800" font-style="italic">YES</text>
    <text x="125" y="80" fill="#0d6e6e" font-size="13" font-weight="800" font-style="italic">NO</text>
  </g>

  <!-- ==================== STEP 6 (ORANGE / HUMAN REVIEW) ==================== -->
  <g transform="translate(630, 480)">
    <rect x="0" y="0" width="225" height="68" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#d97706" font-size="14" font-weight="800">6</text>
    <text x="28" y="24" fill="#92400e" font-size="12.5" font-weight="700">Authorised human review:</text>
    <text x="28" y="42" fill="#b45309" font-size="11.5">Approve refund / Request info /</text>
    <text x="28" y="58" fill="#b45309" font-size="11.5">Reject or Mark handled</text>
  </g>

  <!-- ==================== STEP 7 (ORANGE / AUDIT) ==================== -->
  <g transform="translate(630, 580)">
    <rect x="0" y="0" width="225" height="65" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3" filter="url(#shadow)"/>
    <text x="12" y="25" fill="#d97706" font-size="14" font-weight="800">7</text>
    <text x="28" y="25" fill="#92400e" font-size="12.5" font-weight="700">Log decision, reviewer note,</text>
    <text x="28" y="43" fill="#b45309" font-size="11.5">policy evidence &amp; audit trail</text>
  </g>

  <!-- ==================== STEP 8 ==================== -->
  <g transform="translate(36, 640)">
    <!-- Actor Box -->
    <rect x="0" y="0" width="140" height="65" rx="8" fill="#1e293b"/>
    <text x="70" y="32" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">RESOLV</text>
    <text x="70" y="48" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">EXECUTION</text>
    <!-- Step Box -->
    <rect x="150" y="0" width="425" height="65" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="165" y="26" fill="#0d6e6e" font-size="15" font-weight="800">8</text>
    <text x="185" y="26" fill="#1e293b" font-size="13" font-weight="600">Execute idempotent refund &amp; verify in ledger</text>
    <text x="185" y="45" fill="#475569" font-size="12">Tool call issue_refund, then verify_refund confirms ledger entry</text>
    <text x="185" y="58" fill="#10b981" font-size="11" font-weight="700">✓ Reversal status confirmed · Idempotency protected</text>
  </g>

  <!-- ==================== STEP 9 ==================== -->
  <g transform="translate(36, 735)">
    <!-- Actor Box -->
    <rect x="0" y="0" width="140" height="65" rx="8" fill="#1e293b"/>
    <text x="70" y="32" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">OUTCOMES</text>
    <text x="70" y="48" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">DASHBOARD</text>
    <!-- Step Box -->
    <rect x="150" y="0" width="425" height="65" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="165" y="26" fill="#0d6e6e" font-size="15" font-weight="800">9</text>
    <text x="185" y="26" fill="#1e293b" font-size="13" font-weight="600">Grounded customer reply &amp; live outcome metrics</text>
    <text x="185" y="45" fill="#475569" font-size="12">Reply quotes refund ID and exact RBI credit ETA ("1-2 days");</text>
    <text x="185" y="58" fill="#475569" font-size="12">Live metrics: Autonomous resolution rate, Escalation rate, TAT</text>
  </g>

  <!-- ==================== FOOTER LEGEND ==================== -->
  <g transform="translate(36, 835)">
    <!-- Box 1 Legend -->
    <rect x="0" y="0" width="50" height="24" rx="4" fill="#ffffff" stroke="#0d6e6e" stroke-width="2"/>
    <text x="60" y="17" fill="#334155" font-size="12" font-weight="600">Prototype Autonomous Scope (In-development / Sandboxed Rails)</text>

    <!-- Box 2 Legend -->
    <rect x="520" y="0" width="50" height="24" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="580" y="17" fill="#334155" font-size="12" font-weight="600">Human-in-the-Loop Sign-off / Operations</text>
  </g>
</svg>
